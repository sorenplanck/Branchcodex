[package]
name = "xmr-raw-tx-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
rand_core = "0.6"
monero-address = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
xmr-key-image-proof = { path = "../xmr-key-image-proof" }
thiserror = { workspace = true }
blake2 = { version = "=0.10.6", default-features = false }
monero-oxide = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
monero-ed25519 = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
curve25519-dalek = { workspace = true, features = ["zeroize"] }
zeroize = { workspace = true }
