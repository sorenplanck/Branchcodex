[package]
name = "route-executor"
description = "DOM Interop durable route reducer and transactional route authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["development"]
development = []
production = []
native-xmr-compensation = ["dep:adapter-dom-real", "dep:dom-scriptless-store"]

[dependencies]
blake2 = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
adapter-dom-real = { path = "../adapters/dom-real", optional = true }
dom-scriptless-store = { path = "../dom-scriptless-store", optional = true }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
tempfile = { workspace = true }
