[package]
name = "dom-scriptless-crypto"
license.workspace = true
description = "Cryptographic orchestration boundary for DOM Contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false  # D-ORQ-9: explicit, never inherited
[dependencies]
xmr-compensation-policy = { path = "../xmr-compensation-policy" }
dom-scriptless-primitives = { path = "../dom-scriptless-primitives" }
dom-scriptless-bulletproof = { path = "../dom-scriptless-bulletproof" }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
dom-adaptor.workspace = true
dom-crypto.workspace = true
# Native XMR recovery graph assembly validates the unchanged DOM transaction
# types, proofs, balance equation, kernel signatures and canonical codec.
dom-consensus.workspace = true
dom-core.workspace = true
dom-serialization.workspace = true
dom-scriptless-consensus = { path = "../dom-scriptless-consensus" }
getrandom = "=0.2.16"
sha2 = { version = "=0.10.8", default-features = false, features = ["compress"] }
# Directly reviewed boundary for constant-time secret-key equality checks.
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[dev-dependencies]
kaystra-core = { path = "../kaystra-core", default-features = false }
# Differential reference only; production HKDF state is storage-owned and wiped.
hkdf = { version = "=0.12.4", default-features = false }
# Present only so the `compile_fail` doctest that forbids serializing the
# verified capability can name the trait it forbids. A doctest cannot name a
# transitive dependency, and one that failed because the crate did not resolve
# would assert nothing. No code in this crate implements or derives it.
serde = { version = "=1.0.229", default-features = false }

[lints]
workspace = true
