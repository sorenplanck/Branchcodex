[package]
name = "dxp1-clsag-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Offline CLSAG adaptor experiment; not a wallet or atomic swap"

# Independent laboratory: neither the existing executor nor its build is changed.
[workspace]

[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "zeroize"] }
monero-clsag = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47", features = ["multisig"] }
monero-ed25519 = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
monero-wallet = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
zeroize = "=1.8.2"
frost = { package = "modular-frost", version = "=0.11.0", features = ["ed25519"] }
dalek-ff-group = "=0.5.0"
transcript = { package = "flexible-transcript", version = "=0.3.4", features = ["recommended"] }
rand_chacha = "=0.3.1"
group = "=0.13.0"
dom-core = { path = "../../../crates/dom-core" }
dom-consensus = { path = "../../../crates/dom-consensus" }
dom-serialization = { path = "../../../crates/dom-serialization" }
dom-crypto = { path = "../../../crates/dom-crypto" }
dom-scriptless-primitives = { path = "../../../crates/dom-scriptless-primitives" }
dom-scriptless-bulletproof = { path = "../../../crates/dom-scriptless-bulletproof" }
xmr-dleq-sigma = { path = "../../../crates/adapters/xmr-dleq-sigma" }

[dev-dependencies]
dom-node = { path = "../../../crates/dom-node" }
dom-config = { path = "../../../crates/dom-config" }
dom-wallet = { path = "../../../crates/dom-wallet" }
dom-rpc = { path = "../../../crates/dom-rpc" }
monero-simple-request-rpc = { git = "https://github.com/kayabaNerve/monero-oxide", rev = "c8be5d3d1287669946a83fbfcb296ce2a8852e47" }
tokio = { version = "=1.52.3", features = ["macros", "rt", "time"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }

[profile.release]
overflow-checks = true
