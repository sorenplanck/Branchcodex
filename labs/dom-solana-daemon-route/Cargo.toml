# Provisioning for a DOM route whose counterparty positions are Solana.
#
# Its own workspace, and deliberately NOT part of the Solana leg laboratory: this
# crate depends on `dom-interopd` with its `production` features, which pulls the
# daemon's whole production tree. Keeping it separate leaves the leg's fast test
# job fast.
#
# The dependency shape is the one `crates/deploy-genconfig` already uses and that
# the root workspace excludes for the same reason — a workspace member would unify
# `production` with the default `development` set and trip the feature exclusivity
# guard.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "dom-solana-daemon-route"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Bootstrap provisioning for a DOM daemon route with Solana counterparty positions"

[dependencies]
dom-interopd = { path = "../../crates/dom-interopd", default-features = false, features = ["production"] }
# The registry artifact and its authority sets. Used, never edited: teaching
# `deploy-genconfig::manifest_from_mold` about Solana would be the better long-term
# home for this and is the operator's call, not a change made from here.
deployment-registry = { path = "../../crates/deployment-registry" }
chain-profile = { path = "../../crates/chain-profile" }
btc-crypto = { path = "../../crates/adapters/btc-crypto" }
# Only for `ChainTimingBoundsV1`, which `chain-profile` takes from here and does
# not re-export.
adapter-btc = { path = "../../crates/adapters/btc" }
kaystra-core = { path = "../../crates/kaystra-core" }
# `SenderRoleV1`, which the roster member carries and `dom-interopd` does not
# re-export. Default features only: the fault-injection surface is not among them.
relay = { path = "../../crates/relay" }
dom-consensus = { path = "../../crates/dom-consensus" }
dom-core = { path = "../../crates/dom-core" }
# The ordered terms scope the V2 time authority signs over. `dom-interopd` uses it
# internally and does not re-export it.
route-time-anchor = { path = "../../crates/route-time-anchor" }
# The leg laboratory, as a library.
#
# The two terms artifacts and the two setup bindings this bootstrap needs are
# exactly what the leg produces for its two claim orders, and the leg produces them
# offline: `SolanaLegV1::establish` takes a setup store and an RNG, not a cluster.
# Depending on it here means the artifacts the daemon authenticates are built by the
# same code that settles them against a live validator, instead of a second
# assembly of the same terms that could drift from it.
#
# It cannot activate `dom-interopd/development` and trip the feature exclusivity
# guard, because it does not depend on `dom-interopd` at all.
dom-solana-direct-lab = { path = "../dom-solana-direct" }
# Reached through the leg, and named here because this crate builds the adapter
# profile and reads the binding directly.
solana-profile = { path = "../../crates/adapters/solana-profile" }
solana-setup-store = { path = "../../crates/adapters/solana-setup-store" }
solana-types = { path = "../../crates/adapters/solana-types" }
# `MAX_PROOF_BYTES`, the frozen bound the participant-bundle constructor applies to
# the DLEQ it carries. The crate is named for its first user; the role registry the
# Solana condition lock uses lives in it.
xmr-dleq-sigma = { path = "../../crates/adapters/xmr-dleq-sigma" }
sha2 = "=0.10.8"
# The condition's secret scalar is generated when a position is established. Same
# version the leg laboratory pins.
rand = "=0.8.6"

[dev-dependencies]
tempfile = "=3.24.0"
