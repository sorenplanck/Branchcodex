name: interop-hardening
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  # One run per branch per trigger. This fires on every push, so keying the
  # group on the commit left every superseded run queued behind the fix that
  # replaced it and starved the runner pool. The event name stays in the key
  # so the push and pull_request runs of one commit remain distinct checks.
  group: interop-hardening-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  production-preflight:
    name: "preflight / environment, custody and input boundaries"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No needs edge: a boundary failure must not suppress the other scenarios.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify frozen consensus sources
        id: consensus
        continue-on-error: true
        run: bash scripts/check-consensus-unchanged.sh
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: components
          key: production
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            . -> target
            programs/dom-solana-escrow -> target
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config python3
      - uses: ./.github/actions/xmr-test-tools
        id: boundaries
        continue-on-error: true
        with:
          run-once-regressions: 'true'
      - name: Require all preflight outcomes
        if: always()
        env:
          CONSENSUS: ${{ steps.consensus.outcome }}
          BOUNDARIES: ${{ steps.boundaries.outcome }}
        run: |
          failed=0
          for outcome in "$CONSENSUS" "$BOUNDARIES"; do
            case "$outcome" in success) ;; *) failed=1 ;; esac
          done
          exit "$failed"

  components:
    name: "components / ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    # The native graphs run on separate machines, while every selected shard
    # still reports and uploads its own complete outcome.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [protocol, production-native, production-native-funding, production-native-claim, production-native-wallet-reopen, production-native-templates, production-lib, production-integration]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify frozen consensus sources
        id: consensus
        continue-on-error: true
        run: bash scripts/check-consensus-unchanged.sh
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Protocol must not win the immutable cache save with a target that
          # lacks production. All production jobs build the same initial targets.
          key: ${{ matrix.shard == 'protocol' && 'protocol' || 'production' }}
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            . -> target
            programs/dom-solana-escrow -> target
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config python3

      - name: Install pinned Bitcoin Core
        if: ${{ matrix.shard == 'protocol' }}
        run: |
          BITCOIN_PREFIX="$HOME/.local" bash scripts/f5-install-bitcoin-core.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/xmr-test-tools
        id: xmr_tools
        if: ${{ startsWith(matrix.shard, 'production-') }}
        continue-on-error: true
        with:
          # The independent preflight job owns these once per campaign.
          run-once-regressions: 'false'
      - name: Verify prepared operational integration ingress
        id: prepared_ingress
        if: ${{ matrix.shard == 'production-integration' }}
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: '2'
          RUST_TEST_THREADS: '1'
        run: cargo test --locked -p dom-interopd --no-default-features --features production --test relay_worker --profile crypto-test prepared_operational -- --nocapture
      - name: Execute changed component or production shard
        id: component_graph
        continue-on-error: true
        run: python3 scripts/test_interop_hardening.py --mode full --full-shard ${{ matrix.shard }}
      - name: Retain actual outcomes including failures
        id: evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-hardening-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/interop-hardening/
          if-no-files-found: error
      - name: Fail after all interop checks have reported
        if: always()
        env:
          CONSENSUS: ${{ steps.consensus.outcome }}
          XMR_TOOLS: ${{ steps.xmr_tools.outcome }}
          PREPARED_INGRESS: ${{ steps.prepared_ingress.outcome }}
          COMPONENT_GRAPH: ${{ steps.component_graph.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
        run: |
          failed=0
          for entry in \
            "consensus=$CONSENSUS" \
            "xmr-tools=$XMR_TOOLS" \
            "prepared-ingress=$PREPARED_INGRESS" \
            "component-graph=$COMPONENT_GRAPH" \
            "evidence=$EVIDENCE"
          do
            printf '%s\n' "$entry"
            case "$entry" in
              *=success|*=skipped) ;;
              *=failure|*=cancelled) failed=1 ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
