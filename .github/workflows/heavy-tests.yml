# Heavy test suites that need more RAM/CPU/disk than a constrained local
# machine (WSL, <8 GB) can provide. Everything here already exists in the
# tree and is simply not executed anywhere else:
#
#   * integration-heavy — the `env-blocked-wsl` `#[ignore]` suite of
#     dom-integration-tests (two/three node, reorg, IBD, late join, mempool
#     relay, wallet flow) plus the dom-pow fast/light equivalence test that
#     builds a second ~2 GB RandomX dataset.
#   * interop-full — scripts/test_interop_hardening.py in `--mode full`:
#     the components graph PLUS bitcoin-regtest (real Bitcoin Core),
#     `FOUNDRY_PROFILE=deep forge test` and the Anvil cross-chain gate.
#     interop-hardening.yml only ever runs `--mode components`.
#   * live-composed-route — the `#[ignore]`d f5-e2e LIVE tests: one route
#     scalar revealed on a real Anvil chain and claimed on a real Bitcoin
#     Core regtest node (composed_route_live), and the F7 regtest anchor
#     leg (f7_bitcoin_regtest). They spawn their own bitcoind; this job
#     provides bitcoind/bitcoin-cli/cast on PATH, a live Anvil on :8547
#     and the forge artifact they read.
#   * bp-soak — the DSC-F4 collaborative Bulletproof soak at its full
#     10 000-case requirement (seconds per case locally; hours of CPU).
#   * dom-xmr-native also selects dom-xmr-real-daemon (serial claim and DOM
#     compensation) and dom-xmr-real-refund (XMR refund after public U).
#
# Deliberately NOT here: `#[ignore]`d subprocess crash helpers (only their
# parent tests may invoke them), golden-vector printers ("run only when
# re-freezing on purpose"), fixture-gated XMR replay tests
# (DOM_XMR_REPLAY_FIXTURE_V23), and the Sepolia workflows that spend real
# testnet funds — those stay operator-dispatched in f3/f4-sepolia.yml.

name: heavy-tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which heavy suite to run
        type: choice
        default: all
        options:
          - all
          - integration-heavy
          - interop-full
          - live-composed-route
          - bp-soak
          - dom-xmr-native
  push:
    branches: [codex/domxmr]

permissions:
  contents: read

concurrency:
  group: heavy-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  RUST_BACKTRACE: "1"

jobs:
  integration-heavy:
    name: "env-blocked integration suite + 2 GB RandomX dataset"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'integration-heavy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same reclaim as ci.yml build-test: the workspace test binaries plus
      # the RandomX dataset exhaust the runner's ~14 GB free disk otherwise.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          echo "Disk after cleanup:"; df -h /

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-heavy-integration-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-heavy-integration-${{ steps.rust.outputs.cachekey }}-

      - name: Install Linux build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      # The env-blocked-wsl multi-node suite. Same regtest fast-mining
      # environment the release-blocker-integration-tests job proves out,
      # serial because the nodes bind real local ports.
      - name: dom-integration-tests — full `#[ignore]` suite
        env:
          DOM_NETWORK: regtest
          DOM_REGTEST_FAST_MINING: "1"
          CARGO_PROFILE_TEST_OPT_LEVEL: "3"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked -p dom-integration-tests -- --ignored --test-threads=1

      # Builds the second ~2 GB RandomX dataset and pins fast mode to the
      # frozen consensus vector — minutes of CPU, well beyond an 8 GB WSL.
      - name: dom-pow — fast/light dataset equivalence (2 GB dataset)
        run: cargo test --locked -p dom-pow --test miner_light_equivalence -- --ignored --nocapture

  interop-full:
    name: "interop hardening — FULL / ${{ matrix.shard }}"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'interop-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [protocol, production-native, production-lib, production-integration, live]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules
          df -h /

      - name: Verify frozen consensus sources
        id: interop_consensus
        continue-on-error: true
        run: bash scripts/check-consensus-unchanged.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: interop-full-${{ matrix.shard }}
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'
          workspaces: |
            . -> target
            programs/dom-solana-escrow -> target

      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config python3

      # Install each shard's actual dependencies. Protocol includes the
      # composed Bitcoin test; live retains regtest, forge deep and anvil.
      - name: Install pinned Bitcoin Core
        if: ${{ matrix.shard == 'protocol' || matrix.shard == 'live' }}
        run: |
          BITCOIN_PREFIX="$HOME/.local" bash scripts/f5-install-bitcoin-core.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: foundry-rs/foundry-toolchain@v1
        if: ${{ matrix.shard == 'live' }}
        with:
          version: 1.7.1

      - name: Install pinned Solidity dependencies
        if: ${{ matrix.shard == 'live' }}
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install foundry-rs/forge-std@v1.9.6 --no-git

      - uses: ./.github/actions/xmr-test-tools
        id: interop_xmr_tools
        if: ${{ startsWith(matrix.shard, 'production-') }}
        continue-on-error: true
        with:
          # Pushes have a single owner in interop-hardening. A manual
          # interop-full-only campaign runs these once in production-native.
          run-once-regressions: ${{ matrix.shard == 'production-native' && github.event_name == 'workflow_dispatch' && inputs.suite == 'interop-full' }}

      - name: Verify prepared operational integration ingress
        id: interop_prepared_ingress
        if: ${{ matrix.shard == 'production-integration' }}
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: '2'
          RUST_TEST_THREADS: '1'
        run: cargo test --locked -p dom-interopd --no-default-features --features production --test relay_worker --profile crypto-test prepared_operational -- --nocapture

      - name: Execute full interop shard
        id: interop_full_graph
        continue-on-error: true
        run: python3 scripts/test_interop_hardening.py --mode full --full-shard ${{ matrix.shard }}

      - name: Retain actual outcomes including failures
        id: interop_evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-hardening-full-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/interop-hardening/
          if-no-files-found: error
      - name: Fail after every full-interop check has reported
        if: always()
        env:
          CONSENSUS: ${{ steps.interop_consensus.outcome }}
          XMR_TOOLS: ${{ steps.interop_xmr_tools.outcome }}
          PREPARED_INGRESS: ${{ steps.interop_prepared_ingress.outcome }}
          FULL_GRAPH: ${{ steps.interop_full_graph.outcome }}
          EVIDENCE: ${{ steps.interop_evidence.outcome }}
        run: |
          failed=0
          for entry in \
            "consensus=$CONSENSUS" \
            "xmr-tools=$XMR_TOOLS" \
            "prepared-ingress=$PREPARED_INGRESS" \
            "full-graph=$FULL_GRAPH" \
            "evidence=$EVIDENCE"
          do
            printf '%s\n' "$entry"
            case "$entry" in
              *=success|*=skipped) ;;
              *=failure|*=cancelled) failed=1 ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"

  live-composed-route:
    name: "f5-e2e LIVE — anvil + Bitcoin Core composed route"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'live-composed-route' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-heavy-live-route-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-heavy-live-route-${{ steps.rust.outputs.cachekey }}-

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang pkg-config

      - name: Install pinned Bitcoin Core
        run: |
          BITCOIN_PREFIX="$HOME/.local" bash scripts/f5-install-bitcoin-core.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      # composed_route_live reads the ConditionLockV2 creation bytecode from
      # contracts/out/, so the artifact must exist before the test runs.
      - name: Build the forge artifact the test reads
        working-directory: contracts
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.1.0 --no-git
          forge install foundry-rs/forge-std@v1.9.6 --no-git
          forge build

      # Owns its throwaway bitcoind; ignored only because it needs the
      # installed Bitcoin Core on PATH.
      - name: btc-actuator — Bitcoin Core regtest daemon suite
        run: |
          set -euo pipefail
          cargo test --locked -p btc-actuator --features rpc-http --test bitcoin_core_regtest \
            exact_transaction_is_persisted_broadcast_and_finalized_by_real_core \
            -- --ignored --exact --nocapture --test-threads=1 --color never 2>&1 | tee btc-actuator-regtest.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' btc-actuator-regtest.log

      # The composed route needs a live Anvil at :8547 (the test's default
      # COMPOSED_EVM_RPC); it spawns its own bitcoind. Bounded readiness
      # poll, and the trap stops the node whatever the tests did.
      - name: Composed cross-chain route — LIVE on both chains
        run: |
          set -euo pipefail
          anvil --port 8547 --silent &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if cast chain-id --rpc-url http://127.0.0.1:8547 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          cast chain-id --rpc-url http://127.0.0.1:8547
          cargo test --locked -p f5-e2e --test composed_route_live -- --ignored --nocapture --test-threads=1

      # Both the real regtest anchor leg and its conservative-window
      # boundary regression are mandatory; neither failure may be masked.
      - name: F7 Bitcoin regtest anchor leg and safety-window boundaries
        run: cargo test --locked -p f5-e2e --test f7_bitcoin_regtest -- --include-ignored --nocapture --test-threads=1

  bp-soak:
    name: "DSC-F4 collaborative Bulletproof soak (10 000 cases)"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'bp-soak' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-heavy-bp-soak-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-heavy-bp-soak-${{ steps.rust.outputs.cachekey }}-

      - name: Install Linux build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      # The soak test's own note: "set DSC_F4_SOAK_CASES=10000 for the full
      # requirement". Release profile: the cases are constant-factor crypto,
      # not timing-semantic, and 10 000 debug cases would blow the budget.
      - name: Run the full soak requirement
        env:
          DSC_F4_SOAK_CASES: "10000"
        run: cargo test --locked --release -p dom-adaptor --test collaborative_bp_soak -- --ignored --nocapture

  dom-xmr-native:
    name: "DOM↔XMR native claim — real GPL scan"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'dom-xmr-native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: dom

      - uses: dtolnay/rust-toolchain@stable

      - name: Reuse native DOM compilation even after a failed test
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dom -> target
          key: dom-xmr-native-crypto-test-v23
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'

      - uses: ./dom/.github/actions/xmr-test-tools
        with:
          dom-path: dom
          run-once-regressions: 'false'

      - name: DOM↔XMR native claim, real scanner and durable signing graph
        working-directory: dom
        env:
          CARGO_BUILD_JOBS: "2"
          RUST_TEST_THREADS: "1"
          DOM_XMR_FAILED_FIXTURE_MARKER_V23: ${{ runner.temp }}/dom-xmr-failed-fixture-path.txt
        run: |
          export TMPDIR="$DOM_XMR_PRIVATE_TMP_V23"
          cargo test --locked -p dom-interopd --no-default-features --features production \
            --lib --profile crypto-test \
            production_contracts_bootstrap::producer_v13::native_ceremony_tests::xmr_graph_wallet_tests::v23_native_claim_six_messages_and_presignature_with_real_output_scan \
            -- --exact --nocapture

      # These are generated offline test identities, never operator wallets.
      # Tar retains private modes; artifact ZIP alone does not preserve them.
      - name: Preserve failed synthetic XMR journals
        if: failure()
        shell: bash
        run: |
          marker="$RUNNER_TEMP/dom-xmr-failed-fixture-path.txt"
          if [[ ! -f "$marker" ]]; then
            echo "No retained native fixture was produced."
            exit 0
          fi
          IFS= read -r fixture < "$marker"
          private_tmp="$(realpath -e -- "$DOM_XMR_PRIVATE_TMP_V23")"
          [[ "$private_tmp" == "$HOME/.dx-v23"/dx-* ]]
          [[ "$(stat -c '%u:%a' -- "$private_tmp")" == "$(id -u):700" ]]
          [[ "$fixture" == "$private_tmp"/.tmp* && -d "$fixture" && ! -L "$fixture" ]]
          [[ "$(realpath -- "$fixture")" == "$fixture" ]]
          [[ "$(stat -c '%u:%a' -- "$fixture")" == "$(id -u):700" ]]
          tar -czf "$RUNNER_TEMP/dom-xmr-failed-fixture.tar.gz" -C "$fixture" .

      - name: Upload failed synthetic XMR journals
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dom-xmr-failed-fixture-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dom-xmr-failed-fixture.tar.gz
            ${{ runner.temp }}/dom-xmr-failed-fixture-path.txt
          if-no-files-found: warn
          retention-days: 7

  dom-xmr-real-daemon:
    name: "DOM↔XMR real daemon — claims, DOM compensation, original-store reopen"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'dom-xmr-native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: dom
          submodules: recursive
          fetch-depth: 0

      - name: Initialize explicit not-run evidence
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/dom-xmr-real-evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'dom-xmr-real-evidence'
          (root / 'campaign.json').write_text(json.dumps({
              'schema': 'DOM-XMR-REAL-DAEMON-CAMPAIGN-V23',
              'status': 'not-run',
              'reason': 'scenario prerequisites have not completed',
          }, indent=2) + '\n')
          PY

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dom -> target
          key: dom-xmr-real-daemon-v23
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config python3

      - name: Verify frozen consensus sources
        working-directory: dom
        run: bash scripts/check-consensus-unchanged.sh

      - uses: ./dom/.github/actions/xmr-test-tools
        with:
          dom-path: dom
          real-daemon: 'true'
          # Own the shared regressions exactly once when heavy-tests is
          # dispatched manually for the complete DOM<->XMR campaign.
          run-once-regressions: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'dom-xmr-native') }}

      # A debug or feature-less executable cannot satisfy NativeDaemonBinaryV23.
      # GPL tooling lives in the sibling checkout, outside this build's git state.
      - name: Record the verified release-production binary input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'dom-xmr-real-evidence'
          (evidence / 'daemon-blake2b256.txt').write_text(os.environ['DOM_INTEROP_REAL_BINARY_BLAKE2B256_V23'] + '\n')
          PY

      # The runner invokes BOTH full names with --ignored --exact and insists
      # on one passed test each. Never a blanket ignored suite or a silent skip.
      # Each case has 150 minutes; second case starts only after verified cleanup.
      - name: Run both mandatory real daemon scenarios sequentially
        working-directory: dom
        run: >-
          python3 scripts/run_native_daemon_scenario_v23.py
          --evidence-dir "$RUNNER_TEMP/dom-xmr-real-evidence" --timeout-seconds 9000
          --scenario native_real_daemon_two_claims_survive_original_store_reopen_v23
          --scenario native_real_daemon_dom_compensation_without_counterparty_v23

      - name: Preserve real outcomes and original synthetic journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-xmr-real-daemon-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dom-xmr-real-evidence/campaign.json
            ${{ runner.temp }}/dom-xmr-real-evidence/daemon-blake2b256.txt
            ${{ runner.temp }}/dom-xmr-real-evidence/*/result.json
            ${{ runner.temp }}/dom-xmr-real-evidence/*/test.log
            ${{ runner.temp }}/dom-xmr-real-evidence/*/failed-fixture-path.txt
            ${{ runner.temp }}/dom-xmr-real-evidence/*/synthetic-fixtures.tar.gz
          if-no-files-found: error
          retention-days: 7

  # A separate machine preserves the full 150-minute per-case bound without
  # crowding three scenarios plus builds into one runner's six-hour job limit.
  # No dependency on the claims job: its failure must not silently skip refund.
  dom-xmr-real-refund:
    name: "DOM↔XMR real daemon — XMR refund after public U without counterparty"
    if: ${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'dom-xmr-native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: dom
          submodules: recursive
          fetch-depth: 0

      - name: Initialize explicit not-run refund evidence
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/dom-xmr-refund-evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'dom-xmr-refund-evidence'
          (root / 'campaign.json').write_text(json.dumps({
              'schema': 'DOM-XMR-REAL-DAEMON-CAMPAIGN-V23',
              'status': 'not-run',
              'reason': 'refund scenario prerequisites have not completed',
          }, indent=2) + '\n')
          PY

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dom -> target
          key: dom-xmr-real-daemon-v23
          cache-workspace-crates: 'true'
          cache-on-failure: 'true'

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config python3

      - name: Verify frozen consensus sources
        working-directory: dom
        run: bash scripts/check-consensus-unchanged.sh

      - uses: ./dom/.github/actions/xmr-test-tools
        with:
          dom-path: dom
          real-daemon: 'true'
          run-once-regressions: 'false'

      - name: Record the verified release-production binary input
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'dom-xmr-refund-evidence'
          (evidence / 'daemon-blake2b256.txt').write_text(os.environ['DOM_INTEROP_REAL_BINARY_BLAKE2B256_V23'] + '\n')
          PY

      - name: Run mandatory real XMR refund after public U
        working-directory: dom
        run: >-
          python3 scripts/run_native_daemon_scenario_v23.py
          --evidence-dir "$RUNNER_TEMP/dom-xmr-refund-evidence" --timeout-seconds 9000
          --scenario native_real_daemon_xmr_refund_after_public_u_without_counterparty_v23

      - name: Preserve real refund outcome and original synthetic journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-xmr-real-refund-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dom-xmr-refund-evidence/campaign.json
            ${{ runner.temp }}/dom-xmr-refund-evidence/daemon-blake2b256.txt
            ${{ runner.temp }}/dom-xmr-refund-evidence/*/result.json
            ${{ runner.temp }}/dom-xmr-refund-evidence/*/test.log
            ${{ runner.temp }}/dom-xmr-refund-evidence/*/failed-fixture-path.txt
            ${{ runner.temp }}/dom-xmr-refund-evidence/*/synthetic-fixtures.tar.gz
          if-no-files-found: error
          retention-days: 7

  heavy-gate:
    name: heavy suites gate
    runs-on: ubuntu-latest
    needs: [integration-heavy, interop-full, live-composed-route, bp-soak, dom-xmr-native, dom-xmr-real-daemon, dom-xmr-real-refund]
    if: always()
    steps:
      # skipped is acceptable (a dispatch may select one suite); failure and
      # cancellation are not.
      - name: Require every selected suite to pass
        run: |
          for r in "${{ needs.integration-heavy.result }}" \
                   "${{ needs.interop-full.result }}" \
                   "${{ needs.live-composed-route.result }}" \
                   "${{ needs.bp-soak.result }}" \
                   "${{ needs.dom-xmr-native.result }}" \
                   "${{ needs.dom-xmr-real-daemon.result }}" \
                   "${{ needs.dom-xmr-real-refund.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "a selected heavy suite did not pass: $r"; exit 1 ;;
            esac
          done
          if [[ "${{ github.event_name == 'push' || inputs.suite == 'all' || inputs.suite == 'dom-xmr-native' }}" == "true" ]]; then
            [[ "${{ needs.dom-xmr-native.result }}" == success ]]
            [[ "${{ needs.dom-xmr-real-daemon.result }}" == success ]]
            [[ "${{ needs.dom-xmr-real-refund.result }}" == success ]]
          fi
