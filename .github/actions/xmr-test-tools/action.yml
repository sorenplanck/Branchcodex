name: Prepare native XMR test tools
description: Build pinned GPL tools, then verify custody participants, paths and process startup
inputs:
  dom-path:
    description: DOM checkout path relative to the workspace
    default: '.'
runs:
  using: composite
  steps:
    - name: Verify offline tool isolation and mandatory test dispatch
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      run: |
        set -euo pipefail
        python3 -m unittest discover -s scripts/tests -p test_install_sidecar_tools.py
        python3 -m unittest discover -s scripts/tests -p test_hardening_dispatch_v8.py
    - name: Compile production library, CLI and integration targets
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        CARGO_BUILD_JOBS: '2'
      run: cargo test --locked -p dom-interopd --no-default-features --features production --lib --tests --profile crypto-test --no-run
    - name: Verify Funding and Claim reservation audit purposes
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: cargo test --locked -p dom-adaptor --lib --profile crypto-test reservation_binding::public_audit_v23::tests -- --nocapture --test-threads=1
    - uses: actions/checkout@v4
      with:
        repository: eigenwallet/core
        ref: 0e17c7f7cd8f0657af176c8852aa4c9949586051
        path: .ci-eigenwallet
        persist-credentials: false
    - name: Install pinned offline tool sources
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        XMR_TEST_WORKSPACE: ${{ github.workspace }}/.ci-eigenwallet
      run: |
        set -euo pipefail
        # Cargo resolves every workspace member, even with -p. The Tor/UI
        # applications are not dependencies of these offline crypto tools.
        # Keep the pinned SDK source, dependency declarations and lockfile.
        python3 scripts/install-sidecar-into-eigenwallet.py "$XMR_TEST_WORKSPACE" --tools-only
    - name: Restore GPL crypto compilation, including prior failed test runs
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .ci-eigenwallet -> target
        shared-key: xmr-gpl-crypto-test-v23-0e17c7f7cd8f0657af176c8852aa4c9949586051
        key: ${{ hashFiles(format('{0}/.github/actions/xmr-test-tools/action.yml', inputs.dom-path), format('{0}/external-gpl/dom-xmr-sidecar/**', inputs.dom-path), format('{0}/crates/adapters/xmr-key-image-proof/**', inputs.dom-path), format('{0}/crates/adapters/xmr-raw-tx-verify/**', inputs.dom-path)) }}
        cache-all-crates: 'true'
        cache-on-failure: 'true'
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Build pinned offline tools
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        XMR_TEST_WORKSPACE: ${{ github.workspace }}/.ci-eigenwallet
        CARGO_BUILD_JOBS: '2'
      run: |
        set -euo pipefail
        # The parent Rust tests already use crypto-test, but a child executable
        # does not inherit that profile. Previously both GPL crypto producers
        # ran unoptimized debug code throughout every native graph. Configure
        # the external workspace explicitly without modifying its pinned code.
        # Keep debug assertions and overflow checks in the tools and dependencies.
        cargo build --manifest-path "$XMR_TEST_WORKSPACE/Cargo.toml" \
          --profile crypto-test \
          --config 'profile.crypto-test.inherits="dev"' \
          --config 'profile.crypto-test.opt-level=2' \
          --config 'profile.crypto-test.debug=1' \
          --config 'profile.crypto-test.debug-assertions=true' \
          --config 'profile.crypto-test.overflow-checks=true' \
          --config 'profile.crypto-test.lto=false' \
          --config 'profile.crypto-test.codegen-units=16' \
          --config 'profile.crypto-test.incremental=false' \
          -p dom-xmr-sidecar --bin dom-xmr-sidecar --example offline_native_funding_v23
        chmod go-w "$XMR_TEST_WORKSPACE/target/crypto-test/dom-xmr-sidecar" "$XMR_TEST_WORKSPACE/target/crypto-test/examples/offline_native_funding_v23"
        echo "DOM_XMR_REAL_SIDECAR_V23=$XMR_TEST_WORKSPACE/target/crypto-test/dom-xmr-sidecar" >> "$GITHUB_ENV"
        echo "DOM_XMR_OFFLINE_FUNDING_HELPER_V23=$XMR_TEST_WORKSPACE/target/crypto-test/examples/offline_native_funding_v23" >> "$GITHUB_ENV"
    - name: Verify custody paths and real offline helper startup
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: |
        set -euo pipefail
        cargo test --locked -p dom-interopd --no-default-features --features production --lib --profile crypto-test custody_startup_paths_v23 -- --nocapture
        cargo test --locked -p dom-interopd --no-default-features --features production --lib --profile crypto-test native_offline_funding_preflight_v23 -- --nocapture
    - name: Verify XMR recovery participant ordering
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: cargo test --locked -p dom-scriptless-store --lib --profile crypto-test xmr_round_audit_v11::tests -- --nocapture
