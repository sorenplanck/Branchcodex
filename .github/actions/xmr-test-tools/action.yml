name: Prepare native XMR test tools
description: Build pinned GPL tools, then verify custody participants, paths and process startup
inputs:
  dom-path:
    description: DOM checkout path relative to the workspace
    default: '.'
  real-daemon:
    description: Also build and fingerprint the mandatory release-production daemon
    default: 'false'
  run-once-regressions:
    description: Run shared boundary and producer regressions in this job
    default: 'true'
runs:
  using: composite
  steps:
    - name: Allocate private native fixture root
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      run: |
        set -euo pipefail
        umask 077
        native_tmp="$(python3 -c 'from scripts.run_native_daemon_scenario_v23 import private_synthetic_tmp; print(private_synthetic_tmp())')"
        [[ "$native_tmp" == "$HOME/.dx-v23"/dx-* ]]
        [[ "$(realpath -e -- "$native_tmp")" == "$native_tmp" ]]
        [[ "$(stat -c '%u:%a' -- "$native_tmp")" == "$(id -u):700" ]]
        printf 'DOM_XMR_PRIVATE_TMP_V23=%s\n' "$native_tmp" >> "$GITHUB_ENV"
    - name: Verify private UDS ancestry and actual socket readiness before compilation
      id: uds_preflight
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      run: |
        set -uo pipefail
        failed=0
        python3 -m unittest discover -s scripts/tests -p test_native_uds_preflight_v24.py || failed=1
        python3 scripts/native_uds_preflight_v24.py --result "$RUNNER_TEMP/dom-xmr-uds-preflight.json" || failed=1
        exit "$failed"
    - name: Preserve private UDS readiness result
      id: uds_evidence
      continue-on-error: true
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dom-xmr-uds-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/dom-xmr-uds-preflight.json
        if-no-files-found: warn
        retention-days: 7
    - name: Reclaim hosted runner disk for both production build profiles
      if: ${{ inputs.real-daemon == 'true' }}
      shell: bash
      run: |
        # These are preinstalled SDKs on the disposable GitHub runner, never
        # checkout contents, user directories, or generated test evidence.
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Verify offline tool isolation and mandatory test dispatch
      id: offline_dispatch
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      run: |
        set -uo pipefail
        failed=0
        for pattern in \
          test_install_sidecar_tools.py \
          test_hardening_dispatch_v8.py \
          test_full_interop_matrix_v24.py \
          test_hardening_profile_cache_v24.py \
          test_native_daemon_campaign_v24.py \
          test_scoped_boundary_regressions_v24.py
        do
          python3 -m unittest discover -s scripts/tests -p "$pattern" || failed=1
        done
        python3 scripts/test_xmr_v7_installer_scope.py || failed=1
        exit "$failed"
    - name: Compile production library, CLI and integration targets
      id: compile_production
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        CARGO_BUILD_JOBS: '2'
      run: cargo test --locked -p dom-interopd --no-default-features --features production --lib --tests --profile crypto-test --no-run
    - name: Verify Funding and Claim reservation audit purposes
      id: reservation_audit
      continue-on-error: true
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        TMPDIR: ${{ env.DOM_XMR_PRIVATE_TMP_V23 }}
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: cargo test --locked -p dom-adaptor --lib --profile crypto-test reservation_binding::public_audit_v23::tests -- --nocapture --test-threads=1
    - uses: actions/checkout@v4
      with:
        repository: eigenwallet/core
        ref: 0e17c7f7cd8f0657af176c8852aa4c9949586051
        path: .ci-eigenwallet
        persist-credentials: false
    - name: Install pinned offline tool sources
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        XMR_TEST_WORKSPACE: ${{ github.workspace }}/.ci-eigenwallet
      run: |
        set -euo pipefail
        # Cargo resolves every workspace member, even with -p. The Tor/UI
        # applications are not dependencies of these offline crypto tools.
        # Keep the pinned SDK source, dependency declarations and lockfile.
        python3 scripts/install-sidecar-into-eigenwallet.py "$XMR_TEST_WORKSPACE" --tools-only
    - name: Restore GPL crypto compilation, including prior failed test runs
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .ci-eigenwallet -> target
        shared-key: xmr-gpl-crypto-test-v23-0e17c7f7cd8f0657af176c8852aa4c9949586051
        key: ${{ hashFiles(format('{0}/.github/actions/xmr-test-tools/action.yml', inputs.dom-path), format('{0}/external-gpl/dom-xmr-sidecar/**', inputs.dom-path), format('{0}/crates/adapters/xmr-key-image-proof/**', inputs.dom-path), format('{0}/crates/adapters/xmr-raw-tx-verify/**', inputs.dom-path)) }}
        cache-all-crates: 'true'
        cache-on-failure: 'true'
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Build pinned offline tools
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        XMR_TEST_WORKSPACE: ${{ github.workspace }}/.ci-eigenwallet
        CARGO_BUILD_JOBS: '2'
      run: |
        set -euo pipefail
        # The parent Rust tests already use crypto-test, but a child executable
        # does not inherit that profile. Previously both GPL crypto producers
        # ran unoptimized debug code throughout every native graph. Configure
        # the external workspace explicitly without modifying its pinned code.
        # Keep debug assertions and overflow checks in the tools and dependencies.
        cargo build --manifest-path "$XMR_TEST_WORKSPACE/Cargo.toml" \
          --profile crypto-test \
          --config 'profile.crypto-test.inherits="dev"' \
          --config 'profile.crypto-test.opt-level=2' \
          --config 'profile.crypto-test.debug=1' \
          --config 'profile.crypto-test.debug-assertions=true' \
          --config 'profile.crypto-test.overflow-checks=true' \
          --config 'profile.crypto-test.lto=false' \
          --config 'profile.crypto-test.codegen-units=16' \
          --config 'profile.crypto-test.incremental=false' \
          -p dom-xmr-sidecar --bin dom-xmr-sidecar --example offline_native_funding_v23
        chmod go-w "$XMR_TEST_WORKSPACE/target/crypto-test/dom-xmr-sidecar" "$XMR_TEST_WORKSPACE/target/crypto-test/examples/offline_native_funding_v23"
        echo "DOM_XMR_REAL_SIDECAR_V23=$XMR_TEST_WORKSPACE/target/crypto-test/dom-xmr-sidecar" >> "$GITHUB_ENV"
        echo "DOM_XMR_OFFLINE_FUNDING_HELPER_V23=$XMR_TEST_WORKSPACE/target/crypto-test/examples/offline_native_funding_v23" >> "$GITHUB_ENV"
    - name: Verify public refund authentication and durable Ready recovery
      id: refund_recovery
      continue-on-error: true
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        TMPDIR: ${{ env.DOM_XMR_PRIVATE_TMP_V23 }}
        XMR_TEST_WORKSPACE: ${{ github.workspace }}/.ci-eigenwallet
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: |
        set -uo pipefail
        failed=0
        # Reuse the tool compilation/profile. These targeted regressions do
        # not rerun the native signing graph or an economic daemon scenario.
        for filter in auth::local_refund_tests_v24 cache::build_v23_tests; do
          log="$RUNNER_TEMP/xmr-${filter//::/-}.log"
          if ! cargo test --locked --manifest-path "$XMR_TEST_WORKSPACE/Cargo.toml" \
            --profile crypto-test \
            --config 'profile.crypto-test.inherits="dev"' \
            --config 'profile.crypto-test.opt-level=2' \
            --config 'profile.crypto-test.debug=1' \
            --config 'profile.crypto-test.debug-assertions=true' \
            --config 'profile.crypto-test.overflow-checks=true' \
            --config 'profile.crypto-test.lto=false' \
            --config 'profile.crypto-test.codegen-units=16' \
            --config 'profile.crypto-test.incremental=false' \
            -p dom-xmr-sidecar --bin dom-xmr-sidecar "$filter" \
            -- --nocapture --test-threads=1 --color never 2>&1 | tee "$log"; then
            failed=1
          fi
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log" || failed=1
        done
        exit "$failed"
    - name: Verify scoped funding, custody and transport regressions
      id: scoped_boundaries
      continue-on-error: true
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        TMPDIR: ${{ env.DOM_XMR_PRIVATE_TMP_V23 }}
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: >-
        python3 scripts/scoped_boundary_regressions_v24.py
        --evidence-dir "$RUNNER_TEMP/dom-xmr-boundary-evidence"
    - name: Preserve scoped boundary regression outcomes
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: dom-xmr-boundary-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/dom-xmr-boundary-evidence/
        if-no-files-found: warn
        retention-days: 7
    - name: Verify custody paths and real offline helper startup
      id: custody_startup
      continue-on-error: true
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        TMPDIR: ${{ env.DOM_XMR_PRIVATE_TMP_V23 }}
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: |
        set -uo pipefail
        failed=0
        cargo test --locked -p dom-interopd --no-default-features --features production --lib --profile crypto-test custody_startup_paths_v23 -- --nocapture || failed=1
        cargo test --locked -p dom-interopd --no-default-features --features production --lib --profile crypto-test native_offline_funding_preflight_v23 -- --nocapture || failed=1
        # Exercise the restart path's ownership/authentication guards before
        # any long ceremony. These tests never start a native signing graph.
        log="$RUNNER_TEMP/xmr-sidecar-restart-guards.log"
        if ! cargo test --locked -p dom-interopd --no-default-features --features production --lib --profile crypto-test peer_sidecar_v23:: \
          -- --nocapture --test-threads=1 --color never 2>&1 | tee "$log"; then
          failed=1
        fi
        grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log" || failed=1
        exit "$failed"
    - name: Verify XMR recovery participant ordering
      id: recovery_ordering
      continue-on-error: true
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        TMPDIR: ${{ env.DOM_XMR_PRIVATE_TMP_V23 }}
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: cargo test --locked -p dom-scriptless-store --lib --profile crypto-test xmr_round_audit_v11::tests -- --nocapture
    - name: Verify offline operational artifact producers
      id: artifact_producers
      continue-on-error: true
      if: ${{ always() && inputs.run-once-regressions == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        TMPDIR: ${{ env.DOM_XMR_PRIVATE_TMP_V23 }}
        CARGO_BUILD_JOBS: '2'
        RUST_TEST_THREADS: '1'
      run: |
        set -uo pipefail
        failed=0
        cargo test --locked -p dom-interopd --no-default-features --features production --lib --tests --profile crypto-test --no-fail-fast production_prepare_ -- --nocapture --test-threads=1 || failed=1
        cargo test --locked -p dom-interopd --no-default-features --features production --test route_services_cli --test xmr_enrollment_cli --test xmr_leg_cli --test f6_artifact_cli --test planning_cli --profile crypto-test --no-fail-fast -- --nocapture --test-threads=1 || failed=1
        exit "$failed"
    - name: Build and fingerprint the real release-production daemon
      if: ${{ always() && inputs.real-daemon == 'true' }}
      shell: bash
      working-directory: ${{ inputs.dom-path }}
      env:
        CARGO_BUILD_JOBS: '2'
      run: |
        set -euo pipefail
        cargo build --locked --release -p dom-interopd --no-default-features --features production --bin dom-interopd
        chmod go-w target/release/dom-interopd
        python3 - <<'PY'
        import hashlib, os
        from pathlib import Path
        binary = (Path.cwd() / 'target/release/dom-interopd').resolve(strict=True)
        digest = hashlib.blake2b(digest_size=32)
        with binary.open('rb') as source:
            for chunk in iter(lambda: source.read(65536), b''):
                digest.update(chunk)
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'DOM_INTEROP_REAL_BINARY_V23={binary}\n')
            output.write(f'DOM_INTEROP_REAL_BINARY_BLAKE2B256_V23={digest.hexdigest()}\n')
        PY
    - name: Report every native-tool verification failure
      if: always()
      shell: bash
      env:
        UDS_PREFLIGHT: ${{ steps.uds_preflight.outcome }}
        UDS_EVIDENCE: ${{ steps.uds_evidence.outcome }}
        OFFLINE_DISPATCH: ${{ steps.offline_dispatch.outcome }}
        COMPILE_PRODUCTION: ${{ steps.compile_production.outcome }}
        RESERVATION_AUDIT: ${{ steps.reservation_audit.outcome }}
        REFUND_RECOVERY: ${{ steps.refund_recovery.outcome }}
        SCOPED_BOUNDARIES: ${{ steps.scoped_boundaries.outcome }}
        CUSTODY_STARTUP: ${{ steps.custody_startup.outcome }}
        RECOVERY_ORDERING: ${{ steps.recovery_ordering.outcome }}
        ARTIFACT_PRODUCERS: ${{ steps.artifact_producers.outcome }}
      run: |
        failed=0
        # This check is mandatory in every caller, including tools-only jobs.
        # An absent/skipped preflight never borrows another step's green result.
        [[ "$UDS_PREFLIGHT" == success ]] || failed=1
        [[ "$UDS_EVIDENCE" == success ]] || failed=1
        printf 'private-uds-preflight=%s\n' "$UDS_PREFLIGHT"
        printf 'private-uds-evidence=%s\n' "$UDS_EVIDENCE"
        for entry in \
          "offline-dispatch=$OFFLINE_DISPATCH" \
          "compile-production=$COMPILE_PRODUCTION" \
          "reservation-audit=$RESERVATION_AUDIT" \
          "refund-recovery=$REFUND_RECOVERY" \
          "scoped-boundaries=$SCOPED_BOUNDARIES" \
          "custody-startup=$CUSTODY_STARTUP" \
          "recovery-ordering=$RECOVERY_ORDERING" \
          "artifact-producers=$ARTIFACT_PRODUCERS"
        do
          printf '%s\n' "$entry"
          case "$entry" in
            *=failure|*=cancelled) failed=1 ;;
          esac
        done
        exit "$failed"
